name: refresh

on:
  schedule:
    # Godziny w UTC (Polska zimą = UTC+1, latem = UTC+2; latem wszystko przesuwa się o godzinę później).
    # Minuty celowo nie na pełną godzinę: wtedy GitHub jest najbardziej obciążony i gubi przebiegi.
    # W dzień co 45 min: zimą 6:03, 6:48, 7:33, 8:18 ... 15:48 PL
    - cron: "3 5,8,11,14 * * *"
    - cron: "48 5,8,11,14 * * *"
    - cron: "33 6,9,12 * * *"
    - cron: "18 7,10,13 * * *"
    # W nocy co 3 godziny: zimą 19:03, 22:03, 1:03, 4:03 PL
    - cron: "3 18,21,0,3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Pełne pobranie wszystkich produktów i zdjęć"
        type: boolean
        default: false
      porownaj:
        description: "Zrób porównanie trzech plików"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pełne pobranie: pierwszy przebieg w niedzielę albo ręcznie (full).
      # Porównanie trzech plików: pierwszy przebieg po 6:00 PL, jeśli dziś jeszcze go nie było, albo ręcznie (porownaj).
      - name: Refresh feed
        env:
          SHOPER_URL: ${{ secrets.SHOPER_URL }}
          SHOPER_TOKEN: ${{ secrets.SHOPER_TOKEN }}
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          FULL_INPUT: ${{ inputs.full || false }}
          PORO_INPUT: ${{ inputs.porownaj || false }}
        run: bash odswiez.sh
